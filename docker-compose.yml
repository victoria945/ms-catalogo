services:
  mysql-catalogo:
    image: mysql:8.0
    container_name: mysql-catalogo
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catalogodb}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3309}:3306"
    volumes:
      - mysql_catalogo_data:/var/lib/mysql
    networks:
      - pasteleria-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-catalogo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-catalogo
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    env_file:
      - .env
    depends_on:
      mysql-catalogo:
        condition: service_healthy
    networks:
      - pasteleria-network

networks:
  pasteleria-network:
    external: true

volumes:
  mysql_catalogo_data:
