spring.application.name=ms_catalogo
server.port=${SERVER_PORT:8081}
server.shutdown=graceful
server.error.include-message=always

# Base de datos
spring.datasource.url=${DB_URL:jdbc:h2:mem:catalogodb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}

# Consola H2
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Configuración JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.main.lazy-initialization=${LAZY_INIT:false}

# Migraciones Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Healthcheck Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Configuración JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Configuración AWS Cognito
aws.cognito.region=${AWS_REGION:us-east-1}
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
aws.cognito.issuer-uri=${COGNITO_ISSUER_URI:}

# Cliente Feign
services.inventario.url=${INVENTARIO_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Nivel de logs
logging.level.root=INFO
logging.level.org.gestionpastelera=${LOG_LEVEL:INFO}
